name: Release

# Publishes to npm using TRUSTED PUBLISHING (OIDC). There is no NPM_TOKEN secret in
# this repository and there should never be one: npm mints a short-lived credential for
# this exact workflow, in this exact repo, and records a provenance attestation linking
# the published tarball to the commit that built it. A stolen repo secret is the usual
# way a package gets hijacked; this removes the secret entirely.
#
# Configured at npmjs.com -> each package -> Settings -> Trusted Publisher:
#   Organization or user : codexguy
#   Repository           : bicharts
#   Workflow filename    : release.yml     <-- must match THIS file's name
#   Environment          : (blank)
# Renaming this file breaks publishing until that setting is updated to match.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # REQUIRED: this is what lets npm verify who is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. setup-node ships whatever bundled with
      # the Node release, so pin it rather than hope.
      - run: npm install -g npm@^11
      - run: npm --version

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Never publish a version whose tag disagrees with the manifest. Without this the
      # tag becomes decoration and `git checkout v0.1.1` can produce a different artifact
      # than the one on npm.
      - name: tag must match the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in shape-core chart-host; do
            V=$(node -p "require('./packages/$p/package.json').version")
            echo "$p = $V (tag $TAG)"
            if [ "$V" != "$TAG" ]; then
              echo "::error::packages/$p is $V but the tag says $TAG"
              exit 1
            fi
          done

      # shape-core FIRST: chart-host bundles it at build time, and a consumer who reads
      # the repo may install shape-core directly. Publishing chart-host against a version
      # of shape-core that does not exist yet is a window where the repo lies.
      - name: publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          for p in shape-core chart-host; do
            NAME=$(node -p "require('./packages/$p/package.json').name")
            V=$(node -p "require('./packages/$p/package.json').version")
            # Re-running a release must be safe. npm answers 403 for an existing version,
            # which is indistinguishable from a permissions failure in the log — so ask
            # first and skip deliberately.
            if npm view "$NAME@$V" version >/dev/null 2>&1; then
              echo "$NAME@$V is already published — skipping"
            else
              echo "publishing $NAME@$V"
              npm publish -w "$NAME"
            fi
          done

      - name: dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          npm pack -w @bicharts/shape-core --pack-destination /tmp
          npm pack -w @bicharts/chart-host --pack-destination /tmp
          ls -la /tmp/*.tgz
          echo "dry run only — nothing was published"
